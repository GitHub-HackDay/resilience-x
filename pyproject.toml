[project]
name = "resilience-x"
version = "0.1.0"
description = "AI-powered Q&A demo with GraphRAG and Weaviate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "weaviate-client>=3.25.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]